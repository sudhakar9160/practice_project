name: test_deployment
on: 
  push:
    branches:
      - main
jobs:
  run_lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
      - name: npm_run
        run: npm run lint
  run_test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
      - name: run test
        run: npm run test
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: npm run build
      - name: deployment
        run: echo "deployment..."
